name: Comprobar horario nativo de GitHub

on:
  schedule:
    # Prueba del 21 de noviembre, a la misma hora que el ETL de Cloudflare.
    - cron: '7 22 21 11 *'
      timezone: 'America/Lima'

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Medir demora del disparo
        env:
          CRON_RECEIVED: ${{ github.event.schedule }}
        shell: bash
        run: |
          expected=$(TZ=America/Lima date -d '2026-11-21 22:07:00' +%s)
          now=$(date +%s)
          {
            echo "Cron recibido: $CRON_RECEIVED"
            echo "Hora prevista en Lima: $(TZ=America/Lima date -d "@$expected" '+%F %T %z')"
            echo "Hora real en Lima: $(TZ=America/Lima date -d "@$now" '+%F %T %z')"
            echo "Diferencia en segundos: $((now - expected))"
          } | tee -a "$GITHUB_STEP_SUMMARY"
