name: ETL diario a Neon

on:
  schedule:
    # 03:00 UTC = 22:00 del día anterior en Lima.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      reference_date:
        description: 'Fecha D (YYYY-MM-DD): Alma D−2, Elogim D−1, LibCal D solo hoy en Lima'
        required: true
        type: string
      source:
        description: 'Fuentes que se cargarán'
        required: true
        default: all
        type: choice
        options:
          - all
          - alma
          - elogim
          - libcal

permissions:
  contents: read

concurrency:
  group: etl-neon
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Fijar fecha y fuentes de la ejecución
        id: plan
        env:
          REFERENCE_DATE: ${{ inputs.reference_date }}
          SELECTED_SOURCE: ${{ inputs.source }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == 'schedule' ]]; then
            read -r REFERENCE_DATE LOCAL_HOUR <<< "$(TZ=America/Lima date '+%F %H')"
            if [[ "$GITHUB_RUN_ATTEMPT" != '1' || ! "$LOCAL_HOUR" =~ ^(22|23)$ ]]; then
              echo '::error::Ejecución programada fuera de la ventana original (22:00–23:59 Lima) o reintentada. Usa ejecución manual con fecha explícita para Alma y Elogim.'
              exit 1
            fi
            SELECTED_SOURCE=all
          fi
          if [[ ! "$REFERENCE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] ||
             ! NORMALIZED_DATE="$(date -d "$REFERENCE_DATE" +%F)" ||
             [[ "$NORMALIZED_DATE" != "$REFERENCE_DATE" ]]; then
            echo 'La fecha de referencia debe existir y usar el formato YYYY-MM-DD.' >&2
            exit 1
          fi
          case "$SELECTED_SOURCE" in
            all|alma|elogim|libcal) ;;
            *) echo 'Fuente válida: all, alma, elogim o libcal.' >&2; exit 1 ;;
          esac
          echo "reference_date=$REFERENCE_DATE" >> "$GITHUB_OUTPUT"
          echo "source=$SELECTED_SOURCE" >> "$GITHUB_OUTPUT"

      - name: Obtener código
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Preparar SDK .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json

      - name: Restaurar dependencias
        run: dotnet restore src/PipelineEtl.Console/PipelineEtl.Console.csproj

      - name: Compilar consola
        id: build
        run: dotnet build src/PipelineEtl.Console/PipelineEtl.Console.csproj --configuration Release --no-restore

      - name: Cargar LibCal
        id: libcal
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (steps.plan.outputs.source == 'all' || steps.plan.outputs.source == 'libcal') }}
        env:
          REFERENCE_DATE: ${{ steps.plan.outputs.reference_date }}
          LIBCAL_CLIENT_ID: ${{ secrets.LIBCAL_CLIENT_ID }}
          LIBCAL_CLIENT_SECRET: ${{ secrets.LIBCAL_CLIENT_SECRET }}
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
        shell: bash
        run: |
          if [[ -z "$LIBCAL_CLIENT_ID" || -z "$LIBCAL_CLIENT_SECRET" || -z "$NEON_CONNECTION_STRING" ]]; then
            echo '::error::Falta configurar LIBCAL_CLIENT_ID, LIBCAL_CLIENT_SECRET o NEON_CONNECTION_STRING.'
            exit 1
          fi
          if [[ "$REFERENCE_DATE" != "$(TZ=America/Lima date +%F)" ]]; then
            echo '::error::LibCal solo se puede cargar para hoy en Lima. Para fechas históricas, selecciona alma o elogim.'
            exit 1
          fi
          app=src/PipelineEtl.Console/bin/Release/net10.0/PipelineEtl.Console.dll
          timeout --kill-after=15s 2m dotnet "$app" --init-db
          timeout --kill-after=15s 10m dotnet "$app" --load-libcal --date "$REFERENCE_DATE"

      - name: Cargar Alma (Loans y Renewals)
        id: alma
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (steps.plan.outputs.source == 'all' || steps.plan.outputs.source == 'alma') }}
        env:
          REFERENCE_DATE: ${{ steps.plan.outputs.reference_date }}
          ALMA_API_KEY: ${{ secrets.ALMA_API_KEY }}
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
        shell: bash
        run: |
          if [[ -z "$ALMA_API_KEY" || -z "$NEON_CONNECTION_STRING" ]]; then
            echo 'Falta configurar ALMA_API_KEY o NEON_CONNECTION_STRING.' >&2
            exit 1
          fi
          dotnet run --project src/PipelineEtl.Console/PipelineEtl.Console.csproj \
            --configuration Release --no-build -- --load-alma --date "$REFERENCE_DATE"

      - name: Cargar Elogim
        id: elogim
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (steps.plan.outputs.source == 'all' || steps.plan.outputs.source == 'elogim') }}
        env:
          REFERENCE_DATE: ${{ steps.plan.outputs.reference_date }}
          ELOGIM_CONNECTION_STRING: ${{ secrets.ELOGIM_CONNECTION_STRING }}
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
        shell: bash
        run: |
          if [[ -z "$ELOGIM_CONNECTION_STRING" || -z "$NEON_CONNECTION_STRING" ]]; then
            echo 'Falta configurar ELOGIM_CONNECTION_STRING o NEON_CONNECTION_STRING.' >&2
            exit 1
          fi
          dotnet run --project src/PipelineEtl.Console/PipelineEtl.Console.csproj \
            --configuration Release --no-build -- --load-elogim --date "$REFERENCE_DATE"

      - name: Resumen por fuente
        if: ${{ !cancelled() }}
        env:
          REFERENCE_DATE: ${{ steps.plan.outputs.reference_date }}
          ALMA_OUTCOME: ${{ steps.alma.outcome }}
          ELOGIM_OUTCOME: ${{ steps.elogim.outcome }}
          LIBCAL_OUTCOME: ${{ steps.libcal.outcome }}
        shell: bash
        run: |
          {
            echo "Fecha de referencia: $REFERENCE_DATE (America/Lima)"
            echo ''
            echo '| Fuente | Estado |'
            echo '| --- | --- |'
            echo "| Alma (D−2) | $ALMA_OUTCOME |"
            echo "| Elogim (D−1) | $ELOGIM_OUTCOME |"
            echo "| LibCal (D) | $LIBCAL_OUTCOME |"
          } >> "$GITHUB_STEP_SUMMARY"
